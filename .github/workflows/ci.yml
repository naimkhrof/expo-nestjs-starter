name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: pnpm test:starter
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:up
      - run: pnpm db:migrate
      - name: Smoke test API and Swagger
        run: |
          pnpm --filter @starter/api start:prod > /tmp/starter-api.log 2>&1 &
          node scripts/smoke-api.mjs
      - name: Stop development database
        if: always()
        run: docker compose down
