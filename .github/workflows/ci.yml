name: CI
on:
  push:
    branches: [main]
    # Documentation-only pushes verify nothing new. CLAUDE.md files stay in:
    # scripts/starter.test.mjs reads them.
    paths-ignore:
      - '**/*.md'
      - '!**/CLAUDE.md'
      - '.claude/**'
      - LICENSE
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  # Minutes: in a private repository every job is rounded up to the minute and reinstalls
  # the dependencies, so all checks stay in this one job (CLAUDE.md, « CI et minutes »).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    # Brancher un job de déploiement avec `needs.verify.outputs.<app> == 'true'` (voir deploy-backoffice).
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      backoffice: ${{ steps.changes.outputs.backoffice }}
      api: ${{ steps.changes.outputs.api }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the step below compares this push with the last verified commit of main.
          fetch-depth: 0
      - name: Detect changes per app
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        # The baseline is the last successful run on main, so a failed or cancelled
        # run never hides a pending change. A manual run, or an unknown baseline,
        # reports every app as changed. The mobile app and the back-office also
        # depend on packages/ui (primitives and tokens).
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          changed() {
            if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo true
            elif git diff --quiet "$base" "$GITHUB_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          echo "mobile=$(changed apps/mobile packages/ui)" >> "$GITHUB_OUTPUT"
          echo "backoffice=$(changed apps/backoffice packages/ui)" >> "$GITHUB_OUTPUT"
          echo "api=$(changed apps/api)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      # The checks below are independent: each one runs even if a previous one failed,
      # so a single run reports every failure.
      - if: ${{ !cancelled() }}
        run: pnpm test:starter
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm test
      - if: ${{ !cancelled() }}
        run: pnpm build
      # Migrations up and down on a throwaway database.
      - if: ${{ !cancelled() }}
        name: Database, migrations and SQL tests
        run: |
          pnpm db:up
          pnpm db:migrate
          pnpm test:db
      - if: ${{ !cancelled() }}
        name: Smoke test API and Swagger
        run: |
          pnpm --filter @starter/api start:prod > /tmp/starter-api.log 2>&1 &
          node scripts/smoke-api.mjs
      - name: Stop development database
        if: always()
        run: docker compose down

  # CD : une fois main vérifiée, le back-office (Expo web) part sur Cloudflare Workers, seulement
  # s'il a changé depuis le dernier run vert ; un run manuel déploie toujours. Il faut le secret
  # CLOUDFLARE_API_TOKEN et les variables CLOUDFLARE_ACCOUNT_ID et BACKOFFICE_API_URL (URL de
  # l'API) ; sans eux, le job est sauté avec un avertissement. L'API se déploie seule : Railway
  # construit apps/api/Dockerfile après une CI verte.
  deploy-backoffice:
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-backoffice
      cancel-in-progress: false
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.BACKOFFICE_API_URL }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_RAW" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or BACKOFFICE_API_URL missing: back-office deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.ready == 'true'
        name: Clean and verify the Cloudflare API token
        # The stored secret may carry spaces, quotes or a "Bearer " prefix, which wrangler
        # rejects. Clean it, then check it is an active API token.
        run: |
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d "[:space:]\"'")
          token=${token#Bearer}
          echo "::add-mask::$token"
          for url in \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"; do
            body=$(curl -s -H "Authorization: Bearer $token" "$url")
            if echo "$body" | grep -q '"status":"active"'; then
              echo "Cloudflare API token active."
              echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Cloudflare answered: $body"
          echo "::error::CLOUDFLARE_API_TOKEN is not an active Cloudflare API token (template 'Edit Cloudflare Workers')."
          exit 1
      - if: steps.credentials.outputs.ready == 'true'
        name: Build the back-office
        run: pnpm --filter @starter/backoffice build
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy to Cloudflare Workers
        working-directory: apps/backoffice
        run: pnpm exec wrangler deploy
