name: User story
description: Un comportement livrable et testable de bout en bout, par un seul profil
labels: [story]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: En tant que … je veux … afin de …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Un critère vérifiable par ligne (Étant donné … quand … alors …). Chacun devient un test quand c'est possible.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Maquette
      description: Planche Claude Design (nom et lien), à créer / à modifier / validée. Aucune pour une US sans écran.
  - type: textarea
    id: rules
    attributes:
      label: Règles métier
      description: Chiffres, limites, cas particuliers, données et leur durée de vie, hors périmètre.
  - type: textarea
    id: questions
    attributes:
      label: Questions client
      description: Ce que les sources ne disent pas (label question-client tant qu'il en reste).
  - type: input
    id: source
    attributes:
      label: Source
      description: Version et section du cahier des charges, ou issue de décision (ex. CDC v1.4 §2.1, #42).
